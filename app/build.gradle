plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.chat'
    compileSdk 35

    defaultConfig {
        applicationId "com.dsh.chat"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 1.2 使用本机 debug.keystore 签名；沿用证书才能覆盖安装。
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
