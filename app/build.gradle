plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.chat'
    compileSdk 35

    defaultConfig {
        applicationId "com.dsh.chat"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
